<!DOCTYPE html>
<html>
<head>
    <title>Hide Paragraph using jQuery</title>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>

    <script>
        $(document).ready(function() {
            $("#hideBtn").click(function() {
                $("p").hide();
            });
        });
    </script>
</head>

<body>

    <h2>Hide Paragraph Example using jQuery</h2>

    <p>Periyar University, established in 1997 at Salem, Tamil Nadu, promotes knowledge and social justice with the motto "Wisdom Maketh the World."</p>

    <button id="hideBtn">Hide Paragraph</button>

</body>
</html>
